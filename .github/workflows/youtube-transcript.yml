name: YouTube Transcript to Issue

on:
  workflow_dispatch:
    inputs:
      video:
        description: "YouTube video ID or URL"
        required: true
        type: string
      prefer_manual:
        description: "Prefer manual captions when available"
        required: false
        default: true
        type: boolean
      allow_asr:
        description: "Allow auto-generated (ASR) captions as fallback"
        required: false
        default: true
        type: boolean
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  transcript:
    name: Fetch transcript and create issue
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'transcript-needed' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch transcript and create issue
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.video || format('{0}\n{1}', github.event.issue.title, github.event.issue.body) }}
          PREFER_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.prefer_manual || 'true' }}
          ALLOW_ASR: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_asr || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
          ISSUE_AUTHOR: ${{ github.event_name == 'issues' && github.event.issue.user.login || '' }}
        run: node scripts/youtube-transcript.mjs
